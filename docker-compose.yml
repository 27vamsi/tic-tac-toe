services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: nakama_local_dev
      POSTGRES_DB: nakama
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10

  nakama:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    volumes:
      # Hot-reload runtime module during local dev (optional; rebuild image if removed)
      - ./server/build:/nakama/data/modules
    environment:
      NAKAMA_DATABASE_USER: nakama
      NAKAMA_DATABASE_PASSWORD: nakama_local_dev
      NAKAMA_DATABASE_HOST: postgres
      NAKAMA_DATABASE_PORT: "5432"
      NAKAMA_DATABASE_NAME: nakama
      NAKAMA_DATABASE_SSLMODE: disable
      NAKAMA_LOGGER_LEVEL: DEBUG
      NAKAMA_SERVER_KEY: defaultkey
      NAKAMA_SESSION_ENCRYPTION_KEY: local_dev_encryption_key_min_32_chars
      NAKAMA_SOCKET_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    restart: unless-stopped

volumes:
  postgres-data:
